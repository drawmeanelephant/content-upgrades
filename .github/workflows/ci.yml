name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-eval:
    name: build + test + eval
    runs-on: ubuntu-latest
    steps:
      # First-party actions pin by commit SHA like zig-zouave below (tag kept
      # in the trailing comment); Dependabot files the bump PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by commit SHA (tag v2.2.1-node24). Maintained fork of
      # mlugg/setup-zig: upstream moved to Codeberg and the GitHub copy has been
      # stale since v2.2.1 (Jan 2026). The only functional change is
      # runs.using node20 -> node24, clearing the Actions Node 20 deprecation.
      # To bump, replace the SHA with the new tag's commit and update the tag
      # comment.
      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: "0.17.0"

      - name: zig version
        run: zig version

      # Fail fast before the engine build: keeps src/ under zig fmt so the
      # fmt pass stays a no-op instead of a recurring chore.
      - name: zig fmt --check
        run: cd knap-mcp && zig fmt --check src

      # The cache key is a hash of the two pin lines in scripts/engines.sh, so
      # a pin bump rebuilds the engines and nothing else invalidates the cache.
      - name: Read engine pins
        id: pins
        run: |
          grep -E '^(K4O|DOGBED)_SHA=' scripts/engines.sh | tee "$RUNNER_TEMP/engine-pins.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/engine-pins.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned engine builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/knap-engines
          key: knap-engines-v2-${{ runner.os }}-${{ steps.pins.outputs.hash }}

      # scripts/engines.sh builds each pin from `git archive` of a source repo
      # that contains the pinned commit, so a shallow fetch of just that SHA
      # into $RUNNER_TEMP/src/<name> is enough.
      - name: Build pinned engines
        run: |
          set -eu
          export KNAP_ENGINES_SRC="$RUNNER_TEMP/src"
          export KNAP_ENGINES_DIR="$HOME/.cache/knap-engines"
          while IFS='=' read -r key sha; do
            name=$(echo "$key" | sed 's/_SHA$//' | tr '[:upper:]' '[:lower:]')
            repo="$KNAP_ENGINES_SRC/$name"
            mkdir -p "$repo"
            git -C "$repo" init -q
            git -C "$repo" remote add origin "https://github.com/drawmeanelephant/$name"
            git -C "$repo" fetch -q --depth 1 origin "$sha"
          done < "$RUNNER_TEMP/engine-pins.txt"
          make engines

      - name: Test
        run: make test

      - name: Eval (mock convergence)
        run: KNAP_MCP_HOME=$(mktemp -d) KNAP_ENGINES_DIR="$HOME/.cache/knap-engines" make eval

      - name: Ratchet eval (mock)
        run: KNAP_MCP_HOME=$(mktemp -d) KNAP_ENGINES_DIR="$HOME/.cache/knap-engines" make ratchet-eval

      - name: Voice eval (mock)
        run: KNAP_MCP_HOME=$(mktemp -d) KNAP_ENGINES_DIR="$HOME/.cache/knap-engines" make voice-eval

      - name: Voice contract check
        run: sh knap-mcp/prompts/voice/check.sh

  demo:
    name: make demo (mock backend, boris beat 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: "0.17.0"

      # Same pin-hash cache key as build-test-eval: both jobs share
      # ~/.cache/knap-engines.
      - name: Read engine pins
        id: pins
        run: |
          grep -E '^(K4O|DOGBED)_SHA=' scripts/engines.sh | tee "$RUNNER_TEMP/engine-pins.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/engine-pins.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pinned engine builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/knap-engines
          key: knap-engines-v2-${{ runner.os }}-${{ steps.pins.outputs.hash }}

      - name: Build pinned engines
        run: |
          set -eu
          export KNAP_ENGINES_SRC="$RUNNER_TEMP/src"
          export KNAP_ENGINES_DIR="$HOME/.cache/knap-engines"
          while IFS='=' read -r key sha; do
            name=$(echo "$key" | sed 's/_SHA$//' | tr '[:upper:]' '[:lower:]')
            repo="$KNAP_ENGINES_SRC/$name"
            mkdir -p "$repo"
            git -C "$repo" init -q
            git -C "$repo" remote add origin "https://github.com/drawmeanelephant/$name"
            git -C "$repo" fetch -q --depth 1 origin "$sha"
          done < "$RUNNER_TEMP/engine-pins.txt"
          make engines

      # boris has no prebuilt release binaries; v0.8.2 is a source tag built
      # with Zig 0.16.0 (boris moved to Zig 0.17.0 after v0.8.2, so the repo's
      # pinned 0.17.0 cannot build it).
      - name: Cache boris binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/knap-boris
          key: knap-boris-v2-${{ runner.os }}-v0.8.2-zig0.16.0

      - name: Install boris v0.8.2
        run: scripts/install-boris.sh

      # KNAP_BORIS_PATH makes beat 5 (publish-check) run instead of skipping.
      - name: Demo
        run: KNAP_BORIS_PATH="$HOME/.cache/knap-boris/v0.8.2/boris" KNAP_ENGINES_DIR="$HOME/.cache/knap-engines" KNAP_ENGINES_SRC="$RUNNER_TEMP/src" make demo

      # The B-lane gate: exercises far more of the boris binary (check,
      # validate, artifact regen) than publish-check alone — catches a subtly
      # wrong boris build.
      - name: Boris site selftest
        run: |
          # stage-check.sh reads BORIS (not KNAP_BORIS_PATH); selftest maps
          # either onto KNAP_BORIS_PATH for the knap-mcp side.
          export BORIS="$HOME/.cache/knap-boris/v0.8.2/boris"
          export KNAP_BORIS_PATH="$BORIS"
          export KNAP_K4O_PATH="$(KNAP_ENGINES_DIR="$HOME/.cache/knap-engines" scripts/engines.sh path k4o)"
          sh boris-site/selftest.sh

      - name: Upload demo transcript and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-out
          path: demo/out/demo/
          if-no-files-found: warn
